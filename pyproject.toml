[project]
name = "motorq-de"
version = "0.1.0"
description = "Motorq Decision Engine - capability feasibility and signal economics harness"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "scipy>=1.13",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "psycopg[binary]>=3.1"]
agent = ["anthropic>=0.30"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.4", "import-linter>=2.0"]

[project.scripts]
mde = "motorq_de.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motorq_de"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B019", "E501"]

[tool.importlinter]
root_package = "motorq_de"

[[tool.importlinter.contracts]]
name = "Layers point downward"
type = "layers"
layers = [
    "motorq_de.agent",
    "motorq_de.report",
    "motorq_de.ledger",
    "motorq_de.policy",
    "motorq_de.economics",
    "motorq_de.harness",
    "motorq_de.quality",
    "motorq_de.data",
    "motorq_de.world",
]
