# Decision policy thresholds. Versioned: bump `version` on any change; the brief stamps it.
# 1.4: `seed_sensitive` flag; `sensitivity_steps` for the policy-sensitivity record.
# 1.3: `data_still_improving` flag (learning-curve gain from half to all vehicles > 0.01).
# 1.2: `cost` gate when a request states max_run_cost_usd_month (marginal run cost <= ceiling).
# Owner: data-science lead. Review before each roadmap cycle.
version: "1.4"
gates:
  model_lift_ci_lo: 0.0        # lower CI bound of AUC minus best one-signal model must exceed this
  p_roi_positive: 0.5          # P(ROI > 0) must reach this
flags:
  cross_oem_std: 0.03          # std of leave-one-OEM-out AUC
  cross_oem_min_gap: 0.05      # worst OEM more than this below the mean
  temporal_degradation_upper: 0.03
  roi_p5: 0.0                  # 5th-percentile ROI below this trips roi_spans_negative
  false_alerts_per_100_vehicle_months_max: 25.0   # alert burden ceiling at the chosen operating point
  learning_curve_gain_half_to_full: 0.01          # AUC gain from 50% to 100% of vehicles that counts as still rising
  seed_auc_spread_max: 0.005                      # sufficient-set AUC spread across fold seeds (= ablation tolerance)
# One "step" per threshold for the sensitivity record: the verdict is recomputed with every
# threshold moved one step against the capability and one step in its favour. Request
# constraints (min_oem_coverage, max_run_cost_usd_month, min_signal_history_months) are
# stepped too; the cost step is a fraction of the requested ceiling.
sensitivity_steps:
  min_oem_coverage: 0.05
  model_lift_ci_lo: 0.01
  p_roi_positive: 0.05
  max_run_cost_usd_month: 0.10
  cross_oem_std: 0.01
  temporal_degradation_upper: 0.01
  roi_p5: 0.10
  min_signal_history_months: 1
  false_alerts_per_100_vehicle_months_max: 5.0
  learning_curve_gain_half_to_full: 0.005
  seed_auc_spread_max: 0.0025
