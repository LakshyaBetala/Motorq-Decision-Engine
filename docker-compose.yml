# One command brings up Postgres, the engine API and the dashboard:
#   docker compose up --build
# The API generates the default synthetic dataset on first start (~2 min) unless a volume
# with data/synthetic is mounted. Set ANTHROPIC_API_KEY in .env to enable the LLM interface;
# set MDE_SNOWFLAKE_CONFIG (and SNOWFLAKE_*) to run against Motorq data.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mde
      POSTGRES_PASSWORD: mde
      POSTGRES_DB: mde
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mde"]
      interval: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://mde:mde@db:5432/mde
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MDE_LLM_MODEL: ${MDE_LLM_MODEL:-claude-opus-5}
      MDE_SNOWFLAKE_CONFIG: ${MDE_SNOWFLAKE_CONFIG:-}
      MDE_WEBHOOK_URL: ${MDE_WEBHOOK_URL:-}
      MDE_DASHBOARD_URL: ${MDE_DASHBOARD_URL:-http://localhost:3000}
      MDE_CPUS: ${MDE_CPUS:-4}
    deploy:
      resources:
        limits: { cpus: "${MDE_CPUS:-4}" }
    volumes: [mdedata:/app/data]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
  web:
    build: ./web
    environment:
      MDE_API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
  mdedata:
